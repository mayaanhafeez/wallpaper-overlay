name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Type-check Swift and validate shell
        run: make check

      - name: Build release binary
        run: make

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Lint shell wrapper
        run: shellcheck wallpaper-pick
